name: Build

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open PR number to build'
        required: true
        type: string
      head_sha:
        description: 'Current PR head SHA (7 to 40 hexadecimal characters)'
        required: true
        type: string

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Manual PR {0} {1}', inputs.pr_number, inputs.head_sha) || github.event_name == 'pull_request' && format('PR {0}', github.event.pull_request.number) || github.sha }}

permissions:
  contents: read
  pull-requests: read

jobs:
  target:
    name: Record workflow target
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      repository: ${{ steps.resolve.outputs.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Record PR head or default-branch commit
        id: resolve
        env:
          TARGET_EVENT: ${{ github.event_name }}
          TARGET_PR: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number || 0 }}
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          TARGET_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          TARGET_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: python3 web/tools/resolve_build_target.py
      - uses: actions/upload-artifact@v4
        with:
          name: build-target
          if-no-files-found: error
          path: target.json

  build:
    name: Build current Playground firmware
    runs-on: ubuntu-latest
    needs: target
    env:
      EXPECTED_SHA: ${{ needs.target.outputs.sha }}
      SPECTER_SOURCE_REPOSITORY: ${{ needs.target.outputs.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SPECTER_SOURCE_REPOSITORY }}
          ref: ${{ env.EXPECTED_SHA }}
          submodules: recursive
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ github.sha }}
          path: trusted-tools
      - uses: DeterminateSystems/nix-installer-action@v14
      - name: Build Unix simulator and flashable MockUI firmware
        run: |
          nix develop -c make unix
          nix develop -c make mockui
      - name: Verify embedded MockUI flash image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          firmware = Path("bin/mockui.bin").read_bytes()
          if len(firmware) != 2 * 1024 * 1024:
              raise SystemExit(f"Expected a 2 MiB merged image, got {len(firmware)} bytes")
          filesystem = firmware[0x8000:0x20000]
          if filesystem[510:512] != b"\x55\xaa":
              raise SystemExit("MockUI firmware does not contain the embedded FAT filesystem")
          for marker in (b"LANG", b"COLR", b"FONT"):
              if marker not in filesystem:
                  raise SystemExit(f"Embedded MockUI data is missing {marker!r}")
          print("Verified 2 MiB MockUI image with embedded themes and translations")
          PY
      - name: Record firmware provenance
        env:
          FIRMWARE_FILES: bin/mockui.bin
        run: |
          if test "$GITHUB_EVENT_NAME" = workflow_dispatch; then
            python3 trusted-tools/web/tools/source_info.py firmware
          else
            python3 web/tools/source_info.py firmware
          fi
      - uses: actions/upload-artifact@v4
        id: firmware-upload
        with:
          name: firmware-binaries
          if-no-files-found: error
          path: |
            bin/mockui.bin
            source.json
      - name: Add direct firmware link to the workflow summary
        env:
          ARTIFACT_URL: ${{ steps.firmware-upload.outputs.artifact-url }}
        run: |
          {
            echo '## Flashable Playground firmware'
            echo
            echo "[Download mockui.bin]($ARTIFACT_URL)"
            echo
            echo 'This is the 2 MiB merged STM32F469 image with MockUI, themes and translations. Flash `bin/mockui.bin` at `0x08000000`.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run MockUI tests
        run: |
          pip install -r requirements.txt
          python -m pytest

  browser:
    name: Build and smoke-test Playground browser firmware
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: target
    env:
      EXPECTED_SHA: ${{ needs.target.outputs.sha }}
      SPECTER_SOURCE_REPOSITORY: ${{ needs.target.outputs.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SPECTER_SOURCE_REPOSITORY }}
          ref: ${{ env.EXPECTED_SHA }}
          submodules: recursive
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ github.sha }}
          path: trusted-tools
      - name: Use trusted current browser tooling for an older PR
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p web
          rsync -a --delete trusted-tools/web/ web/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Emscripten 3.1.74
        run: |
          git clone https://github.com/emscripten-core/emsdk.git .browser-work/emsdk
          .browser-work/emsdk/emsdk install 3.1.74
          .browser-work/emsdk/emsdk activate 3.1.74
      - name: Build the checked-out MockUI commit for WebAssembly
        run: bash web/browser/build-browser.sh
      - name: Verify source commit and artifact hashes
        run: python3 web/browser/verify_build.py
      - name: Test preview provenance and publication rules
        run: |
          python3 web/tests/test-publisher.py
          python3 web/tests/test-trigger-pr.py
          python3 web/tests/test-resolve-build-target.py
      - name: Browser smoke tests
        run: |
          npm ci --prefix web
          npx --prefix web playwright install --with-deps chromium
          python3 -m http.server 8765 --directory web > /tmp/specter-browser.log 2>&1 &
          CI=true npm run test:browser --prefix web
      - name: Record browser provenance
        run: python3 web/tools/source_info.py browser
      - uses: actions/upload-artifact@v4
        with:
          name: browser-simulator
          if-no-files-found: error
          path: |
            web/index.html
            web/assets/**
            web/browser/site.js
            web/browser/demo-data.js
            web/browser/runtime-worker.js
            web/browser/runtime/**
            web/browser/current.json
            web/builds/**
            source.json
